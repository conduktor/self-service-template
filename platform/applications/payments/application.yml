apiVersion: self-serve/v1
kind: Application
metadata:
  name: payments
spec:
  title: "Payments"
  description: "Payment processing service"
  owner: "payments-owners" # Console Group technical-id
  # ApplicationGroup policies attach to the Application, not to an ApplicationInstance:
  # an instance's spec.policyRef accepts only Topic, Connector and Subject policies.
  # Attached here, this covers every instance of the application.
  policyRef:
    - appgroup-restrictions
