name: Apply Application Resources
on:
  push:
    branches: [main]
    paths: ['applications/**']
  pull_request:
    paths: ['applications/**']

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.find.outputs.app }}
      instance: ${{ steps.find.outputs.instance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          TARGETS=$(git diff --name-only "$BASE" "$HEAD" -- applications/ \
            | awk -F'/' 'NF>=3 {print $2 "/" $3}' \
            | sort -u)

          if [ -z "$TARGETS" ]; then
            echo "::error::No valid app/instance changes detected under applications/"
            exit 1
          fi

          COUNT=$(echo "$TARGETS" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Changes must be scoped to a single app/instance folder. Found: $TARGETS"
            exit 1
          fi

          APP=$(echo "$TARGETS" | cut -d/ -f1)
          INSTANCE=$(echo "$TARGETS" | cut -d/ -f2)

          VALID_INSTANCES="dev stag prod"
          if ! echo "$VALID_INSTANCES" | grep -qw "$INSTANCE"; then
            echo "::error::Unknown instance '$INSTANCE'. Must be one of: $VALID_INSTANCES"
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "instance=$INSTANCE" >> "$GITHUB_OUTPUT"
          echo "Detected target: $APP/$INSTANCE"

  apply:
    needs: detect
    runs-on: ubuntu-latest
    environment: ${{ needs.detect.outputs.app }}-${{ needs.detect.outputs.instance }}
    defaults:
      run:
        working-directory: applications/${{ needs.detect.outputs.app }}/${{ needs.detect.outputs.instance }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Install Conduktor CLI
        run: |
          curl -sL https://github.com/conduktor/ctl/releases/latest/download/conduktor-linux-amd64 -o conduktor
          chmod +x conduktor
          sudo mv conduktor /usr/local/bin/

      - name: Terraform init
        run: |
          URI="${{ vars.CDK_STATE_REMOTE_URI }}"
          REST="${URI#s3://}"
          BUCKET="${REST%%/*}"
          PREFIX="${REST#"$BUCKET"}"; PREFIX="${PREFIX#/}"; PREFIX="${PREFIX%/}"
          KEY="${PREFIX:+$PREFIX/}terraform.tfstate"
          echo "Backend: bucket=$BUCKET key=$KEY"
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          CDK_BASE_URL: ${{ vars.CDK_BASE_URL }}
          CDK_API_KEY: ${{ secrets.CDK_API_KEY }}

      # `terraform plan` is client-side: it never asks Console whether a
      # resource would be accepted, so ResourcePolicy (CEL) violations do not
      # surface until apply. Render the planned resources back to Conduktor
      # manifests and dry-run them for a real server-side verdict pre-merge.
      - name: Policy check (conduktor dry-run)
        run: |
          terraform show -json tfplan > plan.json
          "$GITHUB_WORKSPACE/scripts/plan-to-manifests.py" plan.json > manifests.yml
          if [ ! -s manifests.yml ]; then
            echo "No policy-targetable resources changed; skipping dry-run."
            exit 0
          fi
          conduktor apply -f manifests.yml --dry-run
        env:
          CDK_BASE_URL: ${{ vars.CDK_BASE_URL }}
          CDK_API_KEY: ${{ secrets.CDK_API_KEY }}

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color -auto-approve tfplan
        env:
          CDK_BASE_URL: ${{ vars.CDK_BASE_URL }}
          CDK_API_KEY: ${{ secrets.CDK_API_KEY }}
