name: Apply Cluster Resources
on:
  push:
    branches: [main]
    paths: ['platform/clusters/**']
  pull_request:
    paths: ['platform/clusters/**']

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      instance: ${{ steps.find.outputs.instance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          TARGETS=$(git diff --name-only "$BASE" "$HEAD" -- platform/clusters/ \
            | awk -F'/' 'NF>=3 {print $3}' \
            | sort -u)

          if [ -z "$TARGETS" ]; then
            echo "::error::No valid instance changes detected under platform/clusters/"
            exit 1
          fi

          COUNT=$(echo "$TARGETS" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Changes must be scoped to a single instance folder. Found: $TARGETS"
            exit 1
          fi

          INSTANCE=$TARGETS

          VALID_INSTANCES="dev prod"
          if ! echo "$VALID_INSTANCES" | grep -qw "$INSTANCE"; then
            echo "::error::Unknown instance '$INSTANCE'. Must be one of: $VALID_INSTANCES"
            exit 1
          fi

          echo "instance=$INSTANCE" >> "$GITHUB_OUTPUT"
          echo "Detected target: $INSTANCE"

  apply:
    needs: detect
    runs-on: ubuntu-latest
    environment: kafka-${{ needs.detect.outputs.instance }}
    defaults:
      run:
        working-directory: platform/clusters/${{ needs.detect.outputs.instance }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Terraform init
        run: |
          URI="${{ vars.CDK_STATE_REMOTE_URI }}"
          REST="${URI#s3://}"
          BUCKET="${REST%%/*}"
          PREFIX="${REST#"$BUCKET"}"; PREFIX="${PREFIX#/}"; PREFIX="${PREFIX%/}"
          KEY="${PREFIX:+$PREFIX/}terraform.tfstate"
          echo "Backend: bucket=$BUCKET key=$KEY"
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          CDK_BASE_URL: ${{ vars.CDK_BASE_URL }}
          CDK_API_KEY: ${{ secrets.CDK_API_KEY }}
          # Replace the ${VAR} placeholders the Conduktor CLI used to interpolate.
          TF_VAR_kafka_bootstrap_servers: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          TF_VAR_kafka_credentials: ${{ secrets.KAFKA_CREDENTIALS }}
          TF_VAR_sr_user: ${{ secrets.SR_USER }}
          TF_VAR_sr_password: ${{ secrets.SR_PASSWORD }}
          TF_VAR_kafka_connect_url: ${{ secrets.KAFKA_CONNECT_URL }}
          TF_VAR_kafka_connect_username: ${{ secrets.KAFKA_CONNECT_USERNAME }}
          TF_VAR_kafka_connect_password: ${{ secrets.KAFKA_CONNECT_PASSWORD }}

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color -auto-approve tfplan
        env:
          CDK_BASE_URL: ${{ vars.CDK_BASE_URL }}
          CDK_API_KEY: ${{ secrets.CDK_API_KEY }}
          # Replace the ${VAR} placeholders the Conduktor CLI used to interpolate.
          TF_VAR_kafka_bootstrap_servers: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          TF_VAR_kafka_credentials: ${{ secrets.KAFKA_CREDENTIALS }}
          TF_VAR_sr_user: ${{ secrets.SR_USER }}
          TF_VAR_sr_password: ${{ secrets.SR_PASSWORD }}
          TF_VAR_kafka_connect_url: ${{ secrets.KAFKA_CONNECT_URL }}
          TF_VAR_kafka_connect_username: ${{ secrets.KAFKA_CONNECT_USERNAME }}
          TF_VAR_kafka_connect_password: ${{ secrets.KAFKA_CONNECT_PASSWORD }}
